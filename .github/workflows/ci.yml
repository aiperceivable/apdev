name: CI

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "typescript/**"
      - "rust/**"
      - "shared/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "python/**"
      - "typescript/**"
      - "rust/**"
      - "shared/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint + tests, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Scoped to this job: a workflow-level default would also apply to the other
    # jobs, whose paths are relative to the repository root.
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install the package with dev tools
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: uvx ruff@0.8.4 check src tests

      - name: Format check
        run: uvx ruff@0.8.4 format --check src tests

      - name: Tests
        run: .venv/bin/python -m pytest -q --cov=apdev --cov-report=term-missing

      - name: Self-check (chars and imports)
        # The tools are useful on themselves; this also catches test data that
        # would make the repository fail its own default check.
        run: |
          .venv/bin/python -m apdev check-chars
          .venv/bin/python -m apdev check-imports

      - name: Build and check the distribution
        if: matrix.python-version == '3.12'
        run: |
          .venv/bin/python -m build
          uvx twine check dist/*

      - name: Lockfile is up to date
        if: matrix.python-version == '3.12'
        run: uv lock --check

  typescript:
    name: typescript (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Tests
        run: pnpm test

  rust:
    name: rust (fmt + clippy + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  release-scripts:
    name: release scripts (syntax + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          bash -n python/src/apdev/release.sh
          bash -n typescript/release.sh
          bash -n rust/release.sh

      - name: Shellcheck
        # Errors and warnings only: the scripts predate the linter, and the
        # remaining notes are style suggestions.
        run: |
          shellcheck --severity=warning python/src/apdev/release.sh
          shellcheck --severity=warning typescript/release.sh
          shellcheck --severity=warning rust/release.sh

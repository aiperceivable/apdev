[build-system]
# setuptools >= 77 understands PEP 639 (SPDX licence expression + license-files).
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apdev"
version = "0.2.8"
description = "Shared development tools for Python projects - character validation, circular import detection, and more"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    {name = "aiperceivable", email = "tercel.yi@gmail.com"}
]
keywords = [
    "development-tools",
    "quality-assurance",
    "linting",
    "static-analysis",
    "character-validation",
    "circular-imports",
    "release-automation",
    "unicode-checker",
    "trojan-source-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=1.1.0;python_version<'3.11'",
]

[project.scripts]
apdev = "apdev.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

# Only `apdev release` needs a build frontend; keep it out of the default install.
release = [
    "build>=1.0",
]

[tool.apdev]
base_package = "apdev"
src_dir = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apdev = ["release.sh", "charsets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
branch = true
source = ["apdev"]

[tool.coverage.report]
# 3.10/3.11 branches (tomli fallback) only run on some CI matrix entries, so the
# gate sits below the local number instead of pretending to be exact.
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM", "RUF", "PTH"]

[project.urls]
Homepage = "https://aiperceivable.com"
Documentation = "https://github.com/aiperceivable/apdev"
Repository = "https://github.com/aiperceivable/apdev"
Issues = "https://github.com/aiperceivable/apdev/issues"
